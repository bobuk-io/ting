format: ting.microapp/2
name: Count words
description: Count the words, characters and lines of the clipboard text.
tools: [wc, awk]

input: clipboard
# Set UTF-8 so wc counts characters rather than bytes.
command: |
  LC_ALL=en_US.UTF-8 wc -lwm | awk '{
    print "| | |\n|---|---:|"
    printf "| Words | %d |\n| Characters | %d |\n| Lines | %d |\n", $2, $3, $1
  }'
output:
  to: [panel]
